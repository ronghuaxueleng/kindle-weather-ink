# Keep the daemon's native encoding: JDK 17 reads worker @argfiles using the
# Windows system encoding. Forcing UTF-8 here breaks non-ASCII classpaths.
# Java source and test encodings are configured explicitly in app/build.gradle.
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
android.useAndroidX=false
android.nonTransitiveRClass=true
# Keep the existing Chinese project directory on Windows.
android.overridePathCheck=true
