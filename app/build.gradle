plugins {
    id 'com.android.application'
}

android {
    namespace 'com.github.ronghuaxueleng.remoteeink'
    compileSdk 33

    defaultConfig {
        applicationId 'com.github.ronghuaxueleng.kindleaidashboard'
        minSdk 17
        targetSdk 28
        versionCode 15
        versionName '1.0.5'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        disable 'OldTargetApi', 'ExpiredTargetSdkVersion'
    }
}

// Decouple source/test text encoding from the Gradle daemon's native encoding.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
